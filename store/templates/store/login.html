{% extends 'store/base.html' %}
{% load static %}

{% block title %}Login — Zavi Luxe{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'store/css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="{% static 'store/images/logo8.png' %}" alt="Zavi Luxe">
      <h2>ZAVI LUXE</h2>
    </div>
    <h1 class="auth-title">Welcome Back</h1>

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" required autofocus placeholder="Enter your username">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" required placeholder="Enter your password">
      </div>
      <button type="submit" class="btn btn-gold btn-full" style="margin-top:8px;">
        Sign In <i class="fas fa-arrow-right"></i>
      </button>
    </form>

    <p class="auth-link">Don't have an account? <a href="{% url 'register' %}">Create one</a></p>
    <p class="auth-link" style="margin-top:8px;"><a href="{% url 'shop' %}" style="color:var(--text-dim);">← Continue as Guest</a></p>
  </div>
</div>
{% endblock %}
