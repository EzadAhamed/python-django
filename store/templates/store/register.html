{% extends 'store/base.html' %}
{% load static %}

{% block title %}Register — Zavi Luxe{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'store/css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card" style="max-width:560px;">
    <div class="auth-logo">
      <img src="{% static 'store/images/logo.png' %}" alt="Zavi Luxe">
      <h2>ZAVI LUXE</h2>
    </div>
    <h1 class="auth-title">Create Account</h1>

    <form method="POST">
      {% csrf_token %}
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input type="text" name="first_name" class="form-input" placeholder="First name">
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input type="text" name="last_name" class="form-input" placeholder="Last name">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Username *</label>
        <input type="text" name="username" class="form-input" required placeholder="Choose a username">
      </div>
      <div class="form-group">
        <label class="form-label">Email Address *</label>
        <input type="email" name="email" class="form-input" required placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password *</label>
        <input type="password" name="password1" class="form-input" required placeholder="Min 8 characters">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password *</label>
        <input type="password" name="password2" class="form-input" required placeholder="Repeat your password">
      </div>
      <button type="submit" class="btn btn-gold btn-full" style="margin-top:8px;">
        Create Account <i class="fas fa-user-plus"></i>
      </button>
    </form>

    <p class="auth-link">Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
  </div>
</div>
{% endblock %}
